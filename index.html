<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Dungeon v32.0 - Ultimate RPG Edition</title>
    <style>
        :root { 
            --bg: #f4f7f6;
            --primary: #0984e3; 
            --text: #2d3436; 
            --danger: #d63031; 
            --success: #27ae60; 
            --gray: #636e72;
            --gold: #f1c40f;
        }
        body { 
            background: var(--bg);
            font-family: -apple-system, sans-serif; 
            margin: 0; 
            color: var(--text);
            overflow-x: hidden; 
        }
        .container { 
            width: 100%;
            max-width: 480px; 
            min-height: 100vh;
            margin: 0 auto; 
            padding: 20px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            z-index: 1;
        }
        
        .global-bg { 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; 
            background-image: url("https://i.imgur.com/SwmBCNA.jpeg"); 
            background-size: cover; 
            background-position: center; 
            z-index: 0;
        }
        .dungeon-bg { 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("https://i.imgur.com/6FeeRyP.jpeg"); 
            background-size: cover; 
            background-position: center; 
            transition: background-image 0.5s ease;
            z-index: 0;
            display: none;
        }

        .splash-screen { 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        .splash-img { 
            width: 100%;
            height: 100%; object-fit: contain; 
            position: absolute; top: 0; left: 0;
        }
        .enter-btn-container { 
            position: absolute;
            bottom: 15%; width: 100%; 
            display: flex; justify-content: center; 
        }
        .btn-rpg { 
            background: #2d3436;
            color: #fff; border: 4px solid #fff;
            padding: 12px 40px; font-size: 1.5rem; font-weight: bold; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 0 4px #2d3436;
            transition: 0.1s; 
        }
        .btn-rpg:active { transform: scale(0.9);
            background: #636e72; }

        .btn { 
            background: #fff;
            border: 1px solid #ddd; padding: 14px;
            margin: 8px 0; cursor: pointer; font-size: 1rem; border-radius: 12px; 
            width: 100%; font-weight: 600;
            box-sizing: border-box; transition: 0.2s; 
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.96); background: #f0f0f0;
        }
        .btn-primary { 
            background: var(--primary);
            color: white; border: none;
            box-shadow: 0 4px 12px rgba(9,132,227,0.2); 
        }
        .btn-outline { 
            color: var(--primary);
            border: 2px solid var(--primary); background: rgba(255,255,255,0.8); 
        }
        .btn-small { padding: 8px; font-size: 0.85rem;
            margin: 5px 2px; flex: 1; }
        .speaker-btn { 
            background: #e1f0ff;
            border: none;
            border-radius: 50%; width: 44px; height: 44px; cursor: pointer; 
            display: inline-flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }
        
        /* RPG Stats Panel */
        .hero-stats {
            background: rgba(255,255,255,0.9);
            border-radius: 15px; padding: 15px; margin-bottom: 15px;
            border: 2px solid #e1b12c;
            display: flex; justify-content: space-between; align-items: center;
        }
        .exp-bar-container {
            flex-grow: 1;
            height: 10px; background: #eee; border-radius: 5px; margin: 0 15px; overflow: hidden;
        }
        .exp-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.3s;
        }

        /* Shop Grid */
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .shop-item {
            background: white;
            border: 2px solid #eee; border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center;
            justify-content: space-between;
        }
        .shop-item:hover { border-color: var(--primary);
        }
        .shop-item.owned { border-color: var(--success); background: #f0fff4;
        }

        .card { 
            background: rgba(255,255,255,0.95);
            border-radius: 24px; padding: 25px; margin: 10px 0;
            min-height: 260px; display: flex; flex-direction: column; justify-content: center; 
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); text-align: center; 
            position: relative; border: 1px solid #eee;
        }
        .card-eng { font-size: 2.2rem; font-weight: bold; color: var(--primary);
        }
        .card-chi { font-size: 1.6rem; font-weight: bold; color: #444; white-space: pre-wrap; line-height: 1.4;
        }
        .example-box { 
            margin-top: 15px;
            padding: 12px; background: #f9f9f9; border-radius: 10px;
            border-left: 4px solid var(--primary); text-align: left; font-style: italic; 
            font-size: 0.95rem; width: 100%; box-sizing: border-box;
        }
        .example-box p { white-space: pre-wrap; margin: 5px 0 0 0; line-height: 1.4; }
        
        .battle-scene { 
            position: relative;
            width: 100%; height: 240px; margin: 10px 0; overflow: visible; 
            background: rgba(255, 255, 255, 0.5); border-radius: 15px; transition: 0.3s;
        }
        .fever-active {
            box-shadow: 0 0 20px 5px rgba(243, 156, 18, 0.8) inset;
            border: 2px solid #f39c12;
        }
        
        /* 置中與佈局修正 */
        .monster-box { position: absolute;
            top: 20px; right: 10%; text-align: center; z-index: 1; }
        .monster-img { width: 90px;
            height: auto; image-rendering: pixelated; transition: 0.3s; transform-origin: center bottom; }
        .player-box { position: absolute;
            bottom: -5px;
            left: 0; z-index: 2; width: 60%; }
        .player-img { width: 100%;
            max-width: 250px; height: auto; transition: 0.3s;
            object-fit: contain; }
        
        /* Floating Text & Slash FX 置中修正 */
        .floating-text {
            position: absolute;
            right: 15%; top: 40px; font-weight: bold; font-size: 1.5rem; z-index: 10;
            animation: float-up 0.8s ease-out forwards; pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }
        @keyframes float-up {
            0% { opacity: 1;
            transform: translateY(0) scale(1); }
            100% { opacity: 0;
            transform: translateY(-50px) scale(1.2); }
        }
        .slash-fx {
            position: absolute;
            right: 5%; top: 10px; width: 120px; height: 120px; z-index: 5;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            clip-path: polygon(0 40%, 100% 45%, 100% 55%, 0 60%);
            animation: slash-anim 0.3s forwards; pointer-events: none; opacity: 0; transform: rotate(45deg);
        }
        @keyframes slash-anim {
            0% { opacity: 1;
            transform: scale(0.5) rotate(45deg) translateX(-30px); }
            100% { opacity: 0;
            transform: scale(1.5) rotate(45deg) translateX(30px); }
        }

        /* 全新自然受擊動畫 */
        @keyframes hit-shake { 
            0% { transform: translateX(0) scale(1);
            filter: brightness(1); }
            20% { transform: translateX(12px) rotate(3deg) scale(0.95);
            filter: brightness(1.5) drop-shadow(0 0 10px rgba(255,0,0,0.6)); }
            50% { transform: translateX(-5px) rotate(-2deg) scale(1.02);
            filter: brightness(1.2); }
            80% { transform: translateX(2px) rotate(1deg);
            filter: brightness(1); }
            100% { transform: translateX(0) scale(1);
            filter: brightness(1); }
        }
        .anim-hit { animation: hit-shake 0.4s ease-out forwards;
        }
        
        @keyframes hurt-red-filter { 0% { filter: brightness(1);
        } 50% { filter: brightness(1.2) sepia(1) saturate(8); } 100% { filter: brightness(1);
        } }
        @keyframes hurt-vibrate { 
            0% { transform: translate(0, 0);
            } 
            20% { transform: translate(3px, 2px);
            } 
            40% { transform: translate(3px, -1px);
            } 
            60% { transform: translate(2px, 1px);
            } 
            80% { transform: translate(3px, 2px);
            } 
            100% { transform: translate(0, 0);
            } 
        }
        .anim-hurt-combined { animation: hurt-vibrate 0.4s, hurt-red-filter 0.4s;
        }

        .timer-line { 
            position: absolute;
            top: -10px; left: 0; height: 6px; 
            background: var(--danger); transition: width 0.1s linear, background-color 0.3s;
        }
        .timer-fever { background: #f1c40f !important; box-shadow: 0 0 10px #f1c40f;
        }
        
        .quiz-grid { display: grid;
            grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        input, textarea { 
            width: 100%;
            padding: 14px; border: 2px solid #eee; 
            border-radius: 12px; margin-bottom: 10px; box-sizing: border-box; font-size: 1rem;
        }
        .footer-img { width: 100%; height: auto; border-radius: 15px;
        }

        .hurt-flash { 
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh; 
            box-shadow: inset 0 0 50px rgba(214, 48, 49, 0.8); pointer-events: none;
            z-index: 999; opacity: 0; 
        }
        .anim-flash { animation: flash-fade 0.5s ease;
        }
        @keyframes flash-fade { 0% { opacity: 0; } 20% { opacity: 1;
        } 100% { opacity: 0; } }

        .combo-text { 
            position: absolute;
            left: 20px; top: 30px; font-size: 1.8rem; 
            font-weight: bold; color: #ff7675; text-shadow: 2px 2px #2d3436; z-index: 10;
            animation: pop 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); display: none;
        }
        @keyframes pop { 0% { transform: scale(0.5);
        } 100% { transform: scale(1); } }

        .boss-hp-bar {
            width: 100%;
            height: 8px; background: #555; border-radius: 4px; margin-bottom: 10px; overflow: hidden; display: none;
        }
        .boss-hp-fill { height: 100%; background: #e74c3c; width: 100%; transition: 0.3s;
        }

        .modal-overlay { 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); display: none; justify-content: center; 
            align-items: center; z-index: 1000;
        }
        .modal-content { 
            background: white;
            padding: 30px; border-radius: 20px; 
            text-align: center; width: 80%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .chest-img { width: 100px;
            height: auto; cursor: pointer; transition: 0.2s; object-fit: contain; }
        .chest-img:hover { transform: scale(1.1);
        }

        .view-section { display: none !important; width: 100%; flex: 1; flex-direction: column;
            justify-content: center; }
        .view-section.active { display: flex !important;
        }
    </style>
</head>
<body>
    <div class="global-bg" id="globalBg"></div>
    <div class="dungeon-bg" id="dungeonBg"></div>
    <div class="hurt-flash" id="hurtFlash"></div>

    <div class="splash-screen" id="view-splash" style="display: flex;">
        <img src="https://i.imgur.com/8MUpGMJ.jpeg" class="splash-img" alt="splash" />
        <div class="enter-btn-container">
            <button class="btn-rpg" onclick="switchView('home')">Enter</button>
        </div>
    </div>

    <div class="container">
        <div id="view-home" class="view-section">
            <h1 style="text-align:center; color:var(--primary); margin-top:0;">VOCAB DUNGEON</h1>
            
            <div class="hero-stats">
                <div style="text-align:center">
                    <div style="font-size: 0.8rem; color: var(--gray)">Lv.</div>
                    <div id="statLevel" style="font-size: 1.5rem; font-weight: bold; color: var(--primary)">1</div>
                </div>
                <div class="exp-bar-container">
                    <div class="exp-bar" id="statExpBar"></div>
                </div>
                <div style="text-align:center">
                    <div style="font-size: 0.8rem; color: var(--gray)">Gold</div>
                    <div id="statGold" style="font-size: 1.2rem; font-weight: bold; color: var(--gold)">0</div>
                </div>
            </div>

            <button class="btn btn-primary" onclick="switchView('menu')">⚔️ 進入地下城</button>
            <button class="btn" style="border-color: #f1c40f; color: #d35400;" onclick="switchView('shop')">🛒 冒險者商店</button>
            <button class="btn" onclick="switchView('add')">➕ 新增單字</button>
            <button class="btn" onclick="switchView('list')">📚 字庫管理 (<span id="bankCount">0</span>)</button>
            
            <div style="flex-grow: 1;"></div>
            <div style="margin-top: auto; padding-top: 10px; text-align: center;">
                <img src="https://i.imgur.com/6UDmnhC.png" class="footer-img" />
            </div>
        </div>

        <div id="view-shop" class="view-section">
            <button class="btn" onclick="switchView('home')">← 返回</button>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
                <h2 style="margin:0;">冒險者商店</h2>
                <strong style="color:var(--gold); font-size:1.2rem;">🪙 <span id="shopGold">0</span></strong>
            </div>
            
            <h4 style="margin: 0 0 10px 0;">消耗品 (自動裝備)</h4>
            <div class="shop-grid">
                <div class="shop-item" onclick="buyItem('potion', 50)">
                    <div style="font-size:2rem;">❤️</div>
                    <strong>生命藥水</strong><br><small>戰鬥初始 HP+1</small><br><span style="color:var(--gold)">🪙 50</span>
                </div>
                <div class="shop-item" onclick="buyItem('hourglass', 50)">
                    <div style="font-size:2rem;">⏳</div>
                    <strong>時間沙漏</strong><br><small>單題作答時間+2秒</small><br><span style="color:var(--gold)">🪙 50</span>
                </div>
            </div>

            <h4 style="margin: 20px 0 10px 0;">專屬外觀 (Skin)</h4>
            <div class="shop-grid" id="skinGrid">
            </div>
        </div>

        <div id="view-menu" class="view-section">
            <button class="btn" onclick="switchView('home')">← 返回</button>
            <h2>選擇模式</h2>
            <button class="btn btn-outline" onclick="startNormal('card')">📖 生字卡 (讀音/例句)</button>
            <button class="btn btn-outline" onclick="startNormal('quiz')">📝 選擇題模式 (看中選英)</button>
            <button class="btn" style="background:#e84393; color:white; border:none;" onclick="startRevenge()">🔥 復仇模式 (專練錯題)</button>
            <hr style="width:100%; border:none; border-top:1px solid #ddd; margin:20px 0"/>
            <h3 style="color:var(--danger)">🏰 地下城戰鬥</h3>
            <button class="btn" onclick="startDungeon('low')">初級地牢 (10層)</button>
            <button class="btn" onclick="startDungeon('mid')">熔岩洞窟 (15層)</button>
            <button class="btn" onclick="startDungeon('high')">冰晶神殿 (20層)</button>
        </div>

        <div id="view-add" class="view-section">
            <button class="btn" onclick="switchView('home')">← 返回</button>
            <h2>新增單字</h2>
            <input type="text" id="newEng" placeholder="英文單字" />
            <button class="btn btn-outline" onclick="autoFetch()">✨ 自動字典翻譯</button>
            <textarea id="newChi" placeholder="中文意思 (自動獲取字典解釋)" rows="3"></textarea>
            <textarea id="newExample" placeholder="例句 (自動獲取精簡例句)" rows="3"></textarea>
            <button class="btn btn-primary" onclick="addNewWord()">💾 儲存</button>
        </div>

        <div id="view-list" class="view-section">
            <button class="btn" onclick="switchView('home')">← 返回</button>
            <h3>我的字庫 (<span id="listCount">0</span>)</h3>
            <div style="display:flex; gap:5px; margin-bottom:15px">
                <button class="btn btn-outline btn-small" onclick="exportCSV()">📤 匯出</button>
                <button class="btn btn-outline btn-small" onclick="document.getElementById('csvInput').click()">📥 匯入</button>
                <input type="file" id="csvInput" style="display:none" accept=".csv" onchange="importCSV(event)" />
            </div>
            <div style="display:flex; gap:5px; margin-bottom:15px">
                <button class="btn btn-small" style="background:var(--danger); color:white; border:none;" onclick="clearAllWords()">🗑️ 清空</button>
                <button class="btn btn-small" style="background:var(--primary); color:white; border:none;" onclick="resetDefaultBank()">🔄 還原</button>
            </div>
            <div id="wordListContainer" style="max-height: 400px; overflow-y: auto;"></div>
        </div>

        <div id="view-study" class="view-section">
            <div class="card" id="studyCard" onclick="handleCardFlip()">
                <div id="card-unflipped" style="width:100%"></div>
                <div id="card-flipped" style="display:none; text-align:left; width:100%">
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <strong style="font-size:1.4rem; color:var(--primary)" id="flipEng"></strong>
                        <button class="speaker-btn" style="width:36px; height:36px" id="flipSpeakBtn">🔊</button>
                    </div>
                    <hr/>
                    <strong>【中文】</strong><p id="flipChi" class="card-chi" style="font-size: 1.1rem; margin-top: 5px;"></p>
                    <div class="example-box"><strong>【例句】</strong><p id="flipEx"></p></div>
                </div>
            </div>
            <div id="readAgainArea" style="text-align:center; display:none; margin-bottom: 15px;">
                <button class="speaker-btn" style="width:auto; padding: 0 20px; border-radius: 20px; font-weight: bold; gap: 8px; font-size: 1rem;" onclick="speak(currentWord.eng)">🔊 再讀一次</button>
            </div>
            <div id="quizOptions" class="quiz-grid" style="display:none"></div>
            <div id="studyFeedback" style="text-align:center; font-weight:bold; margin:10px"></div>
            <button class="btn btn-primary" onclick="nextStudyWord()">下一個</button>
            <button class="btn" onclick="switchView('home')">返回</button>
        </div>

        <div id="view-dungeon" class="view-section">
            <div style="background: #2d3436; color: white; padding: 12px; border-radius: 15px; display:flex; justify-content:space-between; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                <span id="hpDisplay"></span>
                <span id="floorDisplay"></span>
            </div>
            <div class="battle-scene" id="battleScene">
                <div class="timer-line" id="timerLine" style="width:100%"></div>
                <div class="combo-text" id="comboDisplay">🔥 2 Combo!</div>
                <div class="slash-fx" id="slashFx"></div>
                <div class="monster-box">
                    <div class="boss-hp-bar" id="bossHpBar"><div class="boss-hp-fill" id="bossHpFill"></div></div>
                    <img src="https://i.imgur.com/BbjA5GC.png" id="monsterImg" class="monster-img" />
                </div>
                <div class="player-box">
                    <div id="playerImgWrapper" style="transition: transform 0.3s; transform-origin: bottom center;">
                        <img src="https://i.imgur.com/gsR29ty.png" id="playerImg" class="player-img" alt="主角" />
                    </div>
                </div>
            </div>
            <div class="card" style="min-height:60px; padding: 15px; margin-bottom: 10px">
                <div style="font-size:1.3rem; font-weight:bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="dungeonChi"></div>
                <div id="bossEngHint" style="display:none; color:var(--primary); font-size:1.1rem; margin-top:5px; letter-spacing:2px;"></div>
            </div>
            
            <div id="dungeonQuizGrid" class="quiz-grid"></div>
            <div id="dungeonBossArea" style="display:none">
                <input type="text" id="bossInput" placeholder="拼寫單字..." autocomplete="off"/>
                <button class="btn btn-primary" onclick="submitBossAnswer()">⚡ 攻擊 BOSS</button>
            </div>

            <button class="btn" style="color:#999; margin-top: 10px" onclick="clearInterval(timerInterval); switchView('home');">🏳️ 撤退</button>
        </div>

        <div id="view-end" class="view-section">
            <div style="text-align:center">
                <h1 id="endEmoji"></h1>
                <h2 id="endTitle"></h2>
                <div id="endRewards" style="color:var(--gold); font-weight:bold; font-size:1.2rem; margin-bottom: 10px;"></div>
            </div>
            
            <div style="background: rgba(255,255,255,0.95); padding: 15px; border-radius: 15px; margin-top: 10px; max-height: 250px; overflow-y: auto">
                <h4 style="margin: 0 0 10px 0">📊 本次戰果</h4>
                <div style="color: var(--success); margin-bottom: 5px">
                    <strong>擊敗 (<span id="killedCount">0</span>)</strong> 
                </div>
                <div style="color: var(--danger)">
                    <strong>漏掉/錯過 (<span id="missedCount">0</span>)</strong> 
                    <div id="missedListContainer" style="margin-top: 5px;"></div>
                </div>
            </div>

            <button class="btn btn-primary" style="margin-top: 20px" onclick="switchView('home')">返回基地</button>
        </div>
    </div>

    <div class="modal-overlay" id="chestModal">
        <div class="modal-content">
            <h3>🎉 擊敗 Boss！獲得寶箱</h3>
            <img src="https://i.imgur.com/sAsVc32.png" id="chestImg" class="chest-img" onclick="openChest()" alt="寶箱" />
            <p style="color: #636e72" id="chestTip">點擊寶箱開啟獎勵！</p>
            <button class="btn btn-primary" style="margin-top: 10px; display:none" id="chestNextBtn" onclick="closeChestModal()">前往下一關</button>
        </div>
    </div>

    <script>
        const initialWords = [
            {eng:"Ingredient", chi:"n. 成分; 材料", example:"Flour is a main ingredient for bread."},
            {eng:"Carrot", chi:"n. 紅蘿蔔", example:"I like to eat raw carrots."},
            {eng:"Peas", chi:"n. 青豆", example:"We had chicken and peas for dinner."},
            {eng:"Sweet potato", chi:"n. 番薯", example:"Roasted sweet potato is very delicious."},

        /* --- V32.0: 升級版字典檢索 (採用 Google Translate Dictionary API) --- */
        async function autoFetch() {
            const eng = document.getElementById('newEng').value.trim();
            if(!eng) return;
            const btn = document.querySelector('[onclick="autoFetch()"]');
            const originalText = btn.innerText;
            btn.innerText = "⏳ 深度檢索中...";
            
            try {
                // 1. 從 Free Dictionary API 獲取簡單例句
                let bestExample = "";
                try {
                    const dRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(eng)}`);
                    const dData = await dRes.json();
                    let shortestLen = 999;
                    if(Array.isArray(dData) && dData.length > 0) {
                        dData[0].meanings.forEach(meaning => {
                            meaning.definitions.forEach(def => {
                                if (def.example) {
                                    let cleanEx = def.example.replace(/(<([^>]+)>)/gi, "");
                                    if (cleanEx.length > 10 && cleanEx.length < 80 && cleanEx.length < shortestLen) {
                                        shortestLen = cleanEx.length;
                                        bestExample = cleanEx;
                                    }
                                }
                            });
                        });
                    }
                } catch(e) { console.log("Example fetch error", e); }

                // 2. 從 Google Translate API (gtx 模式) 獲取「按詞性分類」的詳細解釋
                let finalChiText = "";
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&dt=bd&q=${encodeURIComponent(eng)}`;
                const tRes = await fetch(url);
                const tData = await tRes.json();

                // tData[1] 包含字典詳細數據 (Parts of speech breakdown)
                if (tData[1] && tData[1].length > 0) {
                    const posMap = { 
                        'noun': 'n.', 'verb': 'v.', 'adjective': 'adj.', 'adverb': 'adv.', 
                        'pronoun': 'pron.', 'preposition': 'prep.', 'conjunction': 'conj.', 'interjection': 'int.' 
                    };
                    let dictLines = [];
                    tData[1].forEach(posGroup => {
                        let posRaw = posGroup[0].toLowerCase();
                        let pos = posMap[posRaw] || `${posRaw}.`;
                        // 提取該詞性最常用的 3 個解釋，並用分號隔開
                        let meanings = posGroup[1].slice(0, 3).join('; ');
                        dictLines.push(`${pos} ${meanings}`);
                    });
                    finalChiText = dictLines.join('\n');
                } else if (tData[0] && tData[0][0] && tData[0][0][0]) {
                    // 如果無字典數據，使用備用的直接翻譯
                    finalChiText = tData[0][0][0];
                }

                document.getElementById('newChi').value = finalChiText || "翻譯失敗，請手動嘗試";
                document.getElementById('newExample').value = bestExample || `I need to learn how to use the word ${eng}.`;

            } catch(e) { 
                if(!document.getElementById('newChi').value) document.getElementById('newChi').value = "系統錯誤，請手動嘗試";
                if(!document.getElementById('newExample').value) document.getElementById('newExample').value = `I need to learn how to use the word ${eng}.`;
            } finally {
                btn.innerText = originalText;
            }
        }

            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });

            link.setAttribute("href", url);

        function importCSV(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const text = evt.target.result;
                const lines = text.split("\n").slice(1);
                const newWords = lines.map((line, i) => {
                    const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (parts.length < 2) return null;
                    return { eng: parts[0].replace(/"/g, '').trim(), chi: parts[1].replace(/"/g, '').trim(), example: parts[2] ? parts[2].replace(/"/g, '').trim() : "", id: Date.now() + i };
                }).filter(x => x && x.eng);
                if (newWords.length > 0) {
                    wordBank = [...newWords, ...wordBank];
                    saveState(); alert(`成功匯入 ${newWords.length} 個單字！`);
                }
            };
            reader.readAsText(file);
        }

        function startDungeon(diff) {
            if(wordBank.length < 4) return alert("單字不足 4 個！");
            dungeonMode = diff;
            maxFloor = (diff === 'low') ? 10 : (diff === 'mid') ? 15 : 20;
            
            maxHp = 10 + (playerState.level > 5 ? 2 : 0);
            if (playerState.potion > 0) { maxHp += playerState.potion;
            playerState.potion = 0; }
            hp = maxHp;
            
            extraTime = playerState.hourglass * 2;
            playerState.hourglass = 0;
            
            floor = 1; combo = 0; killedWords = []; missedWords = [];
            const matchedWrongs = wrongWords.filter(w => wordBank.some(bw => bw.eng === w.eng));
            let list = shuffle(matchedWrongs).slice(0, Math.floor(maxFloor / 2));
            while (list.length < maxFloor) {
                const randomWords = shuffle(wordBank);
                for (let rw of randomWords) {
                    if (list.length >= maxFloor) break;
                    if (!list.some(l => l.eng === rw.eng)) list.push(rw);
                }
            }
            studyList = shuffle(list);
            document.getElementById('comboDisplay').style.display = 'none';
            document.getElementById('battleScene').classList.remove('fever-active');
            switchView('dungeon');
            loadDungeonLevel();
        }

        function loadDungeonLevel() {
            clearInterval(timerInterval);
            currentWord = studyList[floor - 1];
            timeLeft = 100;
            
            const bgIndex = Math.floor((floor - 1) / 5);
            document.getElementById('dungeonBg').style.backgroundImage = `url("${bgImages[Math.min(bgIndex, bgImages.length-1)]}")`;
            
            document.getElementById('timerLine').style.width = '100%';
            document.getElementById('hpDisplay').innerText = "❤️".repeat(Math.min(hp, 15)) + (hp>15 ? `x${hp}` : "");
            document.getElementById('floorDisplay').innerText = `B${floor}/${maxFloor}`;
            
            isBossCurrent = (dungeonMode === 'mid' && (floor === 7 || floor === 15)) ||
                            (dungeonMode === 'high' && (floor % 5 === 0));
            const mImgElement = document.getElementById('monsterImg');
            mImgElement.className = 'monster-img';
            
            const primaryDungeonChi = currentWord.chi.split('\n').join(' | ').substring(0, 30);
            
            if (isBossCurrent) {
                currentMImg = bossImages[Math.floor(Math.random() * bossImages.length)];
                document.getElementById('dungeonQuizGrid').style.display = 'none';
                document.getElementById('dungeonBossArea').style.display = 'block';
                document.getElementById('bossHpBar').style.display = 'block';
                
                bossMaxHp = 3;
                bossCurrentHp = 3;
                document.getElementById('bossHpFill').style.width = '100%';
                
                bossWords = shuffle(wordBank).slice(0, bossMaxHp);
                if(!bossWords.some(w => w.eng === currentWord.eng)) bossWords[0] = currentWord;
                currentWord = bossWords[bossMaxHp - bossCurrentHp];
                
                const bossChi = currentWord.chi.split('\n').join(' | ').substring(0, 30);
                document.getElementById('dungeonChi').innerText = "💀 [BOSS] " + bossChi;
                document.getElementById('bossEngHint').innerText = currentWord.eng.substring(0,2) + "..."; 
                document.getElementById('bossEngHint').style.display = 'block';
                const bossInput = document.getElementById('bossInput');
                bossInput.value = ''; bossInput.focus();
            } else {
                currentMImg = monsterImages[Math.floor(Math.random() * monsterImages.length)];
                document.getElementById('dungeonQuizGrid').style.display = 'grid';
                document.getElementById('dungeonBossArea').style.display = 'none';
                document.getElementById('bossHpBar').style.display = 'none';
                document.getElementById('bossEngHint').style.display = 'none';
                document.getElementById('dungeonChi').innerText = primaryDungeonChi;
                
                const pool = shuffle(wordBank.filter(x => x.eng !== currentWord.eng)).slice(0, 3).map(x => x.eng);
                currentOptions = shuffle([currentWord.eng, ...pool]);
                
                const grid = document.getElementById('dungeonQuizGrid');
                grid.innerHTML = '';
                currentOptions.forEach(opt => {
                    const btn = document.createElement('button'); btn.className = 'btn btn-outline'; btn.innerText = opt;
                    btn.onclick = () => checkDungeonAns(opt === currentWord.eng);
                    grid.appendChild(btn);
                });
            }
            mImgElement.src = currentMImg;
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 100;
            document.getElementById('timerLine').style.width = '100%';

            let totalSeconds = isBossCurrent ? 12 : 6;
            totalSeconds += extraTime;
            const isFever = combo >= 5;
            
            if(isFever) {
                totalSeconds *= 2;
                document.getElementById('battleScene').classList.add('fever-active');
                document.getElementById('timerLine').classList.add('timer-fever');
            } else {
                document.getElementById('battleScene').classList.remove('fever-active');
                document.getElementById('timerLine').classList.remove('timer-fever');
            }

            const step = (100 / (totalSeconds * 10));
            timerInterval = setInterval(() => {
                timeLeft -= step;
                document.getElementById('timerLine').style.width = timeLeft + '%';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval); triggerPlayerHurt(true);
                }
            }, 100);
        }

        function showFloatingText(text, color) {
            const el = document.createElement('div');
            el.className = 'floating-text'; el.style.color = color; el.innerText = text;
            document.getElementById('battleScene').appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function showSlashFx() {
            const fx = document.getElementById('slashFx');
            fx.style.animation = 'none'; fx.offsetHeight; 
            fx.style.animation = 'slash-anim 0.3s forwards';
        }

        function submitBossAnswer() {
            const val = document.getElementById('bossInput').value.trim().toLowerCase();
            const inputEl = document.getElementById('bossInput');
            
            if (val === currentWord.eng.toLowerCase()) {
                bossCurrentHp--;
                document.getElementById('bossHpFill').style.width = `${(bossCurrentHp/bossMaxHp)*100}%`;
                showSlashFx();
                document.getElementById('monsterImg').classList.add('anim-hit');
                speak(currentWord.eng);
                showFloatingText("HIT!", "#f1c40f");
                inputEl.value = '';
                
                setTimeout(() => document.getElementById('monsterImg').classList.remove('anim-hit'), 400);
                if (bossCurrentHp <= 0) {
                    checkDungeonAns(true);
                } else {
                    currentWord = bossWords[bossMaxHp - bossCurrentHp];
                    const bossChi = currentWord.chi.split('\n').join(' | ').substring(0, 30);
                    document.getElementById('dungeonChi').innerText = "💀 [BOSS] " + bossChi;
                    document.getElementById('bossEngHint').innerText = currentWord.eng.substring(0,2) + "...";
                    inputEl.focus();
                }
            } else {
                inputEl.value = '';
                triggerPlayerHurt(false);
            }
        }

        function checkDungeonAns(isCorrect) {
            clearInterval(timerInterval);
            if (isCorrect) {
                combo++;
                if (combo >= 2) {
                    const cb = document.getElementById('comboDisplay');
                    cb.style.display = 'block'; cb.innerText = `🔥 ${combo} Combo!`;
                }
                killedWords.push(currentWord);
                wrongWords = wrongWords.filter(w => w.eng !== currentWord.eng);
                
                showSlashFx();
                showFloatingText(`+${10 + combo * 2} EXP`, "#2ecc71");

                const mImgElement = document.getElementById('monsterImg');
                mImgElement.classList.add('anim-hit');
                speak(currentWord.eng);
                if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(300);
                
                setTimeout(() => {
                    mImgElement.classList.remove('anim-hit');
                    if (floor >= maxFloor) endGame('win');
                    else if (isBossCurrent) showChest();
                    else { floor++; loadDungeonLevel(); }
                }, 600);
            } else {
                triggerPlayerHurt(false);
            }
        }

        function triggerPlayerHurt(isTimeout) {
            combo = 0;
            document.getElementById('comboDisplay').style.display = 'none';
            document.getElementById('battleScene').classList.remove('fever-active');
            
            if (!wrongWords.some(w => w.eng === currentWord.eng)) wrongWords.push(currentWord);
            if (!missedWords.some(w => w.eng === currentWord.eng)) missedWords.push(currentWord);
            
            hp--;
            document.getElementById('hpDisplay').innerText = "❤️".repeat(Math.min(hp, 15)) + (hp>15 ? `x${hp}` : "");

            const flash = document.getElementById('hurtFlash');
            flash.classList.add('anim-flash'); setTimeout(() => flash.classList.remove('anim-flash'), 500);
            const pImg = document.getElementById('playerImg');
            pImg.classList.add('anim-hurt-combined');
            setTimeout(() => pImg.classList.remove('anim-hurt-combined'), 400);

            if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([100, 50, 100]);
            
            if (hp <= 0) setTimeout(() => endGame('lose'), 600);
            else setTimeout(() => startTimer(), 800); 
        }

        function showChest() {
            chestStatus = 'closed';
            document.getElementById('chestImg').src = "https://i.imgur.com/sAsVc32.png";
            document.getElementById('chestTip').innerText = '點擊寶箱開啟獎勵！';
            document.getElementById('chestNextBtn').style.display = 'none';
            document.getElementById('chestModal').style.display = 'flex';
        }

        function openChest() {
            if (chestStatus !== 'closed') return;
            chestStatus = 'open';
            document.getElementById('chestImg').src = "https://i.imgur.com/JNPgpc7.png";
            
            const goldDrop = Math.floor(Math.random() * 20) + 10;
            playerState.gold += goldDrop;

            if (Math.random() < 0.5) {
                hp++;
                document.getElementById('chestTip').innerText = `你獲得了：❤️ 生命+1 / 🪙 金幣+${goldDrop}`;
            } else {
                extraTime += 2;
                document.getElementById('chestTip').innerText = `你獲得了：⏱️ 時間+2s / 🪙 金幣+${goldDrop}`;
            }
            document.getElementById('chestNextBtn').style.display = 'block';
        }

        function closeChestModal() {
            document.getElementById('chestModal').style.display = 'none';
            floor++; loadDungeonLevel();
        }

        function endGame(result) {
            clearInterval(timerInterval);
            const expGain = killedWords.length * 15 + (result === 'win' ? 100 : 0);
            const goldGain = killedWords.length * 2 + (result === 'win' ? 30 : 0);
            
            playerState.exp += expGain;
            playerState.gold += goldGain;
            let levelUpMsg = "";
            const expReq = playerState.level * 100;
            if (playerState.exp >= expReq) {
                playerState.level++;
                playerState.exp -= expReq;
                levelUpMsg = "✨ LEVEL UP! ✨";
            }
            
            saveState();
            document.getElementById('endEmoji').innerText = (result === 'win') ? '🎉' : '💀';
            document.getElementById('endTitle').innerText = (result === 'win') ? '挑戰成功' : '你倒下了';
            document.getElementById('endRewards').innerText = `獲得 ${expGain} EXP / 🪙 ${goldGain} ${levelUpMsg ? '\n'+levelUpMsg : ''}`;
            
            document.getElementById('killedCount').innerText = killedWords.length;
            document.getElementById('missedCount').innerText = missedWords.length;
            
            const missedContainer = document.getElementById('missedListContainer');
            missedContainer.innerHTML = '';
            if (missedWords.length === 0) {
                missedContainer.innerText = '太棒了，無漏網之魚！';
            } else {
                missedWords.forEach(w => {
                    const shortChi = w.chi.replace(/\n/g, ' ').substring(0, 15);
                    const d = document.createElement('div');
                    d.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#fff; padding:5px; border-radius:5px; margin-top:5px; border:1px solid #ddd;";
                    d.innerHTML = `<span><strong>${w.eng}</strong> <span style="font-size:0.8rem;color:#666">${shortChi}...</span></span>
                                   <button class="speaker-btn" style="width:28px; height:28px; font-size:0.8rem;" onclick="speak('${w.eng}')">🔊</button>`;
                    missedContainer.appendChild(d);
                });
            }

            switchView('end');
        }

        document.getElementById('bossInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') submitBossAnswer();
        });
        
        init();
    </script>
</body>
</html>
