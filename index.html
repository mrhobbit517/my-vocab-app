<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Dungeon v12.0 - Full Word Bank</title>
    <style>
        :root { 
            --bg: #f4f7f6;
            --primary: #0984e3; 
            --text: #2d3436; 
            --danger: #d63031; 
            --success: #27ae60; 
            --gray: #636e72;
        }
        body { 
            background: var(--bg);
            font-family: -apple-system, sans-serif; 
            margin: 0; 
            color: var(--text);
            overflow-x: hidden; 
        }
        .container { 
            width: 100%;
            max-width: 480px; 
            min-height: 100vh;
            margin: 0 auto; 
            padding: 20px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            z-index: 1;
        }
        
        .global-bg { 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; 
            background-image: url("https://i.imgur.com/SwmBCNA.jpeg"); 
            background-size: cover; 
            background-position: center; 
            z-index: 0;
        }
        .dungeon-bg { 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("https://i.imgur.com/6FeeRyP.jpeg"); 
            background-size: cover; 
            background-position: center; 
            z-index: 0; 
            display: none;
        }

        .splash-screen { 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        .splash-img { 
            width: 100%;
            height: 100%; object-fit: contain; 
            position: absolute; top: 0; left: 0;
        }
        .enter-btn-container { 
            position: absolute;
            bottom: 15%; width: 100%; 
            display: flex; justify-content: center; 
        }
        .btn-rpg { 
            background: #2d3436;
            color: #fff; border: 4px solid #fff;
            padding: 12px 40px; font-size: 1.5rem; font-weight: bold; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 0 4px #2d3436;
            transition: 0.1s; 
        }
        .btn-rpg:active { transform: scale(0.9); background: #636e72; }

        .btn { 
            background: #fff;
            border: 1px solid #ddd; padding: 14px;
            margin: 8px 0; cursor: pointer; font-size: 1rem; border-radius: 12px; 
            width: 100%; font-weight: 600;
            box-sizing: border-box; transition: 0.2s; 
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.96); background: #f0f0f0; }
        .btn-primary { 
            background: var(--primary);
            color: white; border: none;
            box-shadow: 0 4px 12px rgba(9,132,227,0.2); 
        }
        .btn-outline { 
            color: var(--primary);
            border: 2px solid var(--primary); background: rgba(255,255,255,0.8); 
        }
        .btn-small { padding: 8px; font-size: 0.85rem; margin: 5px 2px; flex: 1; }
        .speaker-btn { 
            background: #e1f0ff;
            border: none;
            border-radius: 50%; width: 44px; height: 44px; cursor: pointer; 
            display: inline-flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }
        .card { 
            background: rgba(255,255,255,0.95);
            border-radius: 24px; padding: 25px; margin: 10px 0;
            min-height: 260px; display: flex; flex-direction: column; justify-content: center; 
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); text-align: center; 
            position: relative; border: 1px solid #eee;
        }
        .card-eng { font-size: 2.2rem; font-weight: bold; color: var(--primary); }
        .example-box { 
            margin-top: 15px;
            padding: 12px; background: #f9f9f9; border-radius: 10px;
            border-left: 4px solid var(--primary); text-align: left; font-style: italic; 
            font-size: 0.95rem; width: 100%; box-sizing: border-box;
        }
        
        /* 戰鬥畫面與動畫 */
        .battle-scene { 
            position: relative;
            width: 100%; height: 240px; margin: 10px 0; overflow: visible; 
            background: rgba(255, 255, 255, 0.5); border-radius: 15px;
        }
        .monster-box { position: absolute; top: 10px; right: 40px; text-align: center; z-index: 1; }
        .monster-img { width: 90px; height: auto; image-rendering: pixelated; transition: 0.3s; }
        .player-box { position: absolute; bottom: -10px; left: -20px; z-index: 2; }
        .player-img { width: 270px; height: auto; transition: 0.3s; object-fit: contain; }
        
        @keyframes hit-shake { 
            0% { transform: translateX(0); } 
            20% { transform: translateX(-15px) scale(1.1); filter: brightness(1.2) sepia(1) saturate(8); } 
            40% { transform: translateX(10px) scale(1.05); filter: brightness(1.2) sepia(1) saturate(8); }
            60% { transform: translateX(-10px) scale(1); filter: brightness(1.1) sepia(0.5); }
            100% { transform: scale(0) translateX(-50px); opacity: 0; filter: brightness(1); } 
        }
        .anim-hit { animation: hit-shake 0.6s forwards; }
        
        @keyframes hurt-vibrate { 
            0% { transform: translate(0, 0); } 
            10% { transform: translate(-4px, -2px); } 
            100% { transform: translate(0, 0); } 
        }
        .anim-hurt-combined { animation: hurt-vibrate 0.4s; }

        .timer-line { 
            position: absolute;
            top: -10px; left: 0; height: 6px; 
            background: var(--danger); transition: width 0.1s linear;
        }
        .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        input, textarea { 
            width: 100%;
            padding: 14px; border: 2px solid #eee; 
            border-radius: 12px; margin-bottom: 10px; box-sizing: border-box; font-size: 1rem;
        }
        .footer-img { width: 100%; height: auto; margin-top: 20px; border-radius: 15px; }

        .view-section { display: none !important; width: 100%; flex: 1; flex-direction: column; justify-content: center; }
        .view-section.active { display: flex !important; }
    </style>
</head>
<body onload="init()">
    <div class="global-bg" id="globalBg"></div>
    <div class="dungeon-bg" id="dungeonBg"></div>

    <div class="splash-screen" id="view-splash" style="display: flex;">
        <img src="https://i.imgur.com/8MUpGMJ.jpeg" class="splash-img" alt="splash" />
        <div class="enter-btn-container">
            <button class="btn-rpg" id="mainEnterBtn" onclick="switchView('home')">Enter</button>
        </div>
    </div>

    <div class="container">
        <div id="view-home" class="view-section">
            <h1 style="text-align:center; color:var(--primary)">VOCAB DUNGEON</h1>
            <button class="btn btn-primary" onclick="switchView('menu')">開始挑戰</button>
            <button class="btn" onclick="switchView('add')">新增單字</button>
            <button class="btn" onclick="switchView('list')">字庫管理 (<span id="bankCount">0</span>)</button>
            <img src="https://i.imgur.com/6UDmnhC.png" class="footer-img" />
        </div>

        <div id="view-menu" class="view-section">
            <button class="btn" onclick="switchView('home')">← 返回</button>
            <h2>選擇模式</h2>
            <button class="btn btn-outline" onclick="startNormal('card')">生字卡 (自動讀音/例句)</button>
            <button class="btn btn-outline" onclick="startNormal('quiz')">選擇題模式 (看中選英)</button>
            <hr style="width:100%; border:none; border-top:1px solid #ddd; margin:20px 0"/>
            <h3 style="color:var(--danger)">🏰 地下城戰鬥</h3>
            <button class="btn" onclick="startDungeon('low')">初級 (10層)</button>
            <button class="btn" onclick="startDungeon('mid')">中級 (15層)</button>
            <button class="btn" onclick="startDungeon('high')">高級 (20層)</button>
        </div>

        <div id="view-add" class="view-section">
            <button class="btn" onclick="switchView('home')">← 返回</button>
            <h2>新增單字</h2>
            <input type="text" id="newEng" placeholder="輸入英文單字" />
            <button class="btn btn-outline" onclick="autoFetch()">✨ 高精密自動翻譯 (含詞性/例句)</button>
            <textarea id="newChi" placeholder="中文意思 (詞性)"></textarea>
            <textarea id="newExample" placeholder="例句" rows="3"></textarea>
            <button class="btn btn-primary" onclick="addNewWord()">💾 儲存 (Enter 可觸發)</button>
        </div>

        <div id="view-list" class="view-section">
            <button class="btn" onclick="switchView('home')">← 返回</button>
            <h3>我的字庫 (<span id="listCount">0</span>)</h3>
            <div id="wordListContainer" style="max-height: 400px; overflow-y: auto; background:rgba(255,255,255,0.8); border-radius:12px; padding:10px;"></div>
            <button class="btn" style="margin-top:20px; color:red" onclick="resetDefaultBank()">⚠️ 重置回 CSV 預設單字</button>
        </div>

        <div id="view-study" class="view-section">
            <div class="card" id="studyCard" onclick="handleCardFlip()">
                <div id="card-unflipped" style="width:100%"></div>
                <div id="card-flipped" style="display:none; text-align:left; width:100%">
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <strong style="font-size:1.4rem; color:var(--primary)" id="flipEng"></strong>
                        <button class="speaker-btn" id="flipSpeakBtn" onclick="event.stopPropagation(); speakCurrent();">🔊</button>
                    </div>
                    <hr/>
                    <strong>【意思/詞性】</strong><p id="flipChi"></p>
                    <div class="example-box"><strong>【例句】</strong><p id="flipEx"></p></div>
                </div>
            </div>
            <div id="quizOptions" class="quiz-grid" style="display:none"></div>
            <div id="studyFeedback" style="text-align:center; font-weight:bold; margin:10px"></div>
            <button class="btn btn-primary" onclick="nextStudyWord()">下一個</button>
            <button class="btn" onclick="switchView('home')">返回</button>
        </div>

        <div id="view-dungeon" class="view-section">
            <div style="background: #2d3436; color: white; padding: 12px; border-radius: 15px; display:flex; justify-content:space-between; margin-bottom: 15px">
                <span id="hpDisplay"></span>
                <span id="floorDisplay"></span>
            </div>
            <div class="battle-scene">
                <div class="timer-line" id="timerLine" style="width:100%"></div>
                <div class="monster-box"><img src="https://i.imgur.com/BbjA5GC.png" id="monsterImg" class="monster-img" /></div>
                <div class="player-box"><img src="https://i.imgur.com/gsR29ty.png" id="playerImg" class="player-img" /></div>
            </div>
            <div class="card" style="min-height:60px; padding: 15px; margin-bottom: 10px">
                <div style="font-size:1.3rem; font-weight:bold" id="dungeonChi"></div>
            </div>
            
            <div id="dungeonQuizGrid" class="quiz-grid"></div>
            
            <div id="bossArea" style="display:none; width:100%">
                <input type="text" id="bossInput" placeholder="拼寫單字... 按 Enter 攻擊" />
                <button class="btn btn-primary" onclick="submitBossAnswer()">⚡ 攻擊 BOSS</button>
            </div>

            <button class="btn" style="color:#999; margin-top: 10px" onclick="clearInterval(timerInterval); switchView('home');">🏳️ 撤退</button>
        </div>

        <div id="view-end" class="view-section">
            <div style="text-align:center"><h1 id="endEmoji"></h1><h2 id="endTitle"></h2></div>
            <button class="btn btn-primary" style="margin-top: 20px" onclick="switchView('home')">返回主頁</button>
        </div>
    </div>

    <script>
        // 全部生字庫整合 (CSV 資料 + 預設資料)
        const initialWords = [
            {eng:"Ingredient", chi:"(n.) 成分/材料", example:"Flour is a main ingredient for bread."},
            {eng:"Carrot", chi:"(n.) 紅蘿蔔", example:"I like to eat raw carrots."},
            {eng:"Peas", chi:"(n.) 豌豆", example:"We had chicken and peas for dinner."},
            {eng:"Sweet potato", chi:"(n.) 番薯", example:"Roasted sweet potato is very delicious."},
            {eng:"Onion", chi:"(n.) 洋蔥", example:"Cutting an onion makes me cry."},
            {eng:"Pepper", chi:"(n.) 甜椒/胡椒", example:"Add some pepper to the soup."},
            {eng:"Aubergine", chi:"(n.) 茄子", example:"Aubergine is also called eggplant."},
            {eng:"Sweetcorn", chi:"(n.) 粟米", example:"I love eating sweetcorn with butter."},
            {eng:"Peel", chi:"(v.) 削皮/剝皮", example:"Please peel the apple for me."},
            {eng:"Fry", chi:"(v.) 煎/炸", example:"You can fry an egg in the pan."},
            {eng:"Roast", chi:"(v.) 烤/烘", example:"We roast a chicken every Sunday."},
            {eng:"Toaster", chi:"(n.) 多士爐", example:"Put the bread in the toaster."},
            {eng:"Kettle", chi:"(n.) 水煲", example:"The kettle is boiling."},
            {eng:"Coffee Machine", chi:"(n.) 咖啡機", example:"This coffee machine is easy to use."},
            {eng:"Blender", chi:"(n.) 攪拌機", example:"I use a blender to make smoothies."},
            {eng:"Rice Cooker", chi:"(n.) 電飯煲", example:"Put the rice into the rice cooker."},
            {eng:"Hand Mixer", chi:"(n.) 手提攪拌器", example:"Use a hand mixer to whip the cream."},
            {eng:"Dishwasher", chi:"(n.) 洗碗機", example:"Put the dirty plates in the dishwasher."},
            {eng:"Oven", chi:"(n.) 焗爐", example:"The cake is baking in the oven."},
            {eng:"Airfryer", chi:"(n.) 氣炸鍋", example:"An airfryer uses less oil."},
            {eng:"Scarf", chi:"(n.) 圍巾", example:"I wear a scarf in winter."},
            {eng:"Toothbrush", chi:"(n.) 牙刷", example:"Change your toothbrush regularly."},
            {eng:"Shower", chi:"(n./v.) 淋浴", example:"I take a shower every morning."},
            {eng:"Flush", chi:"(v.) 沖水", example:"Don't forget to flush the toilet."},
            {eng:"Razor", chi:"(n.) 剃刀", example:"He uses a sharp razor to shave."},
            {eng:"Tap", chi:"(n.) 水龍頭", example:"Turn off the tap to save water."},
            {eng:"Towel", chi:"(n.) 毛巾", example:"Dry your hands with a towel."},
            {eng:"Shower Curtain", chi:"(n.) 浴簾", example:"Please close the shower curtain."},
            {eng:"Bathrobe", chi:"(n.) 浴袍", example:"Put on your bathrobe after a bath."},
            {eng:"Sponge", chi:"(n.) 海綿", example:"I use a sponge to wash the car."},
            {eng:"Shower Cap", chi:"(n.) 浴帽", example:"She wears a shower cap in the shower."},
            {eng:"Kitten", chi:"(n.) 小貓", example:"The kitten is playing with a ball."},
            {eng:"Foal", chi:"(n.) 小馬", example:"The foal is standing next to its mother."},
            {eng:"Chick", chi:"(n.) 小雞", example:"A yellow chick is very cute."},
            {eng:"Joey", chi:"(n.) 小袋鼠", example:"A joey lives in its mother's pouch."},
            {eng:"Puppy", chi:"(n.) 小狗", example:"My puppy loves to bark."},
            {eng:"Piglet", chi:"(n.) 小豬", example:"The piglet is eating corn."},
            {eng:"Lamb", chi:"(n.) 小羊", example:"A lamb has white wool."},
            {eng:"Calf", chi:"(n.) 小牛", example:"The calf is drinking milk."},
            {eng:"Helicopter", chi:"(n.) 直升機", example:"The helicopter flew over the city."},
            {eng:"Lorry", chi:"(n.) 貨車", example:"The lorry is carrying heavy boxes."},
            {eng:"Shuttle", chi:"(n.) 接駁車", example:"Take the shuttle to the airport."}
        ].map((w, i) => ({ ...w, id: Date.now() + i }));

        let wordBank = [];
        let studyList = [];
        let currentWord = null;
        let studyMode = 'card';
        let isFlipped = false;
        let hp = 10;
        let floor = 1;
        let maxFloor = 10;
        let timerInterval = null;
        let timeLeft = 100;
        let isBoss = false;

        function init() {
            const savedBank = localStorage.getItem('vocab_v12_full');
            wordBank = savedBank ? JSON.parse(savedBank) : initialWords;
            updateGlobalCounts();
            renderList();
            
            // 監聽全局 Enter 鍵
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    handleGlobalEnter();
                }
            });
        }

        function handleGlobalEnter() {
            const currentView = document.querySelector('.view-section.active')?.id;
            const splashView = document.getElementById('view-splash');
            
            if (splashView.style.display === 'flex') {
                switchView('home');
            } else if (currentView === 'view-add') {
                const engVal = document.getElementById('newEng').value;
                const chiVal = document.getElementById('newChi').value;
                if(engVal && !chiVal) autoFetch();
                else if(engVal && chiVal) addNewWord();
            } else if (currentView === 'view-dungeon' && isBoss) {
                submitBossAnswer();
            }
        }

        function saveState() {
            localStorage.
