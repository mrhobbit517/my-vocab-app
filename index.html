<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Dungeon v23.0 - Full Management & Audio</title>
    <style>
        :root { 
            --bg: #f4f7f6;
            --primary: #0984e3; 
            --text: #2d3436; 
            --danger: #d63031; 
            --success: #27ae60; 
            --gray: #636e72;
        }
        body { 
            background: var(--bg);
            font-family: -apple-system, sans-serif; 
            margin: 0; 
            color: var(--text);
            overflow-x: hidden; 
        }
        .container { 
            width: 100%;
            max-width: 480px; 
            min-height: 100vh;
            margin: 0 auto; 
            padding: 20px; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            z-index: 1;
        }
        
        .global-bg { 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; 
            background-image: url("https://i.imgur.com/SwmBCNA.jpeg"); 
            background-size: cover; 
            background-position: center; 
            z-index: 0;
        }
        .dungeon-bg { 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("https://i.imgur.com/6FeeRyP.jpeg"); 
            background-size: cover; 
            background-position: center; 
            z-index: 0; 
            display: none;
        }

        .splash-screen { 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; 
            z-index: 1000; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        .splash-img { 
            width: 100%;
            height: 100%; object-fit: contain; 
            position: absolute; top: 0; left: 0;
        }
        .enter-btn-container { 
            position: absolute;
            bottom: 15%; width: 100%; 
            display: flex; justify-content: center; 
        }
        .btn-rpg { 
            background: #2d3436;
            color: #fff; border: 4px solid #fff;
            padding: 12px 40px; font-size: 1.5rem; font-weight: bold; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 0 4px #2d3436;
            transition: 0.1s; 
        }
        .btn-rpg:active { transform: scale(0.9); background: #636e72; }

        .btn { 
            background: #fff;
            border: 1px solid #ddd; padding: 14px;
            margin: 8px 0; cursor: pointer; font-size: 1rem; border-radius: 12px; 
            width: 100%; font-weight: 600;
            box-sizing: border-box; transition: 0.2s; 
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.96); background: #f0f0f0; }
        .btn-primary { 
            background: var(--primary);
            color: white; border: none;
            box-shadow: 0 4px 12px rgba(9,132,227,0.2); 
        }
        .btn-danger { background: var(--danger); color: white; border: none; }
        .btn-outline { 
            color: var(--primary);
            border: 2px solid var(--primary); background: rgba(255,255,255,0.8); 
        }
        .btn-small { padding: 8px; font-size: 0.85rem; margin: 5px 2px; flex: 1; }
        
        .speaker-btn { 
            background: #e1f0ff;
            border: none;
            border-radius: 50%; width: 50px; height: 50px; cursor: pointer; 
            display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: 10px;
        }

        .card { 
            background: rgba(255,255,255,0.95);
            border-radius: 24px; padding: 25px; margin: 10px 0;
            min-height: 220px; display: flex; flex-direction: column; justify-content: center; 
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06); text-align: center; 
            position: relative; border: 1px solid #eee;
        }
        .card-eng { font-size: 2.2rem; font-weight: bold; color: var(--primary); }
        .card-chi { font-size: 1.8rem; font-weight: bold; color: #444; }
        .example-box { 
            margin-top: 15px;
            padding: 12px; background: #f9f9f9; border-radius: 10px;
            border-left: 4px solid var(--primary); text-align: left; font-style: italic; 
            font-size: 0.95rem; width: 100%; box-sizing: border-box;
        }
        
        .battle-scene { 
            position: relative;
            width: 100%; height: 240px; margin: 10px 0; overflow: visible; 
            background: rgba(255, 255, 255, 0.4); border-radius: 15px;
        }
        .monster-box { position: absolute; top: 10px; right: 40px; text-align: center; z-index: 1; }
        .monster-img { width: 90px; height: auto; image-rendering: pixelated; transition: 0.3s; }
        .player-box { position: absolute; bottom: -10px; left: -20px; z-index: 2; }
        .player-img { width: 270px; height: auto; transition: 0.3s; object-fit: contain; }
        
        .timer-line { 
            position: absolute;
            top: -10px; left: 0; height: 6px; 
            background: var(--danger); transition: width 0.1s linear;
        }
        .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        input, textarea { 
            width: 100%;
            padding: 14px; border: 2px solid #eee; 
            border-radius: 12px; margin-bottom: 10px; box-sizing: border-box; font-size: 1rem;
        }

        /* 底部圖片樣式調整 - 提高位置 */
        .home-footer-img {
            margin-top: 30px;
            width: 100%;
            text-align: center;
            transform: translateY(-20px); /* 向上提高一點 */
        }
        .footer-img { width: 100%; height: auto; border-radius: 15px; }

        .hurt-flash { 
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh; 
            box-shadow: inset 0 0 50px rgba(214, 48, 49, 0.8); pointer-events: none;
            z-index: 999; opacity: 0; 
        }
        .anim-flash { animation: flash-fade 0.5s ease; }
        @keyframes flash-fade { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }

        .modal-overlay { 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); display: none; justify-content: center; 
            align-items: center; z-index: 1000;
        }
        .modal-content { 
            background: white; padding: 30px; border-radius: 20px; 
            text-align: center; width: 80%; max-width: 320px; 
        }
        
        .chest-img { width: 100px; height: auto; cursor: pointer; transition: 0.2s; }
        .view-section { display: none; width: 100%; flex-direction: column; flex-grow: 1; }
        .view-section.active { display: flex; }

        .word-item {
            padding: 12px; border-bottom: 1px solid #eee; display: flex; 
            justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>
    <div class="global-bg" id="globalBg"></div>
    <div class="dungeon-bg" id="dungeonBg"></div>
    <div class="hurt-flash" id="hurtFlash"></div>

    <div class="splash-screen" id="view-splash" style="display: flex;">
        <img src="https://i.imgur.com/8MUpGMJ.jpeg" class="splash-img" />
        <div class="enter-btn-container">
            <button class="btn-rpg" onclick="switchView('home')">Enter</button>
        </div>
    </div>

    <div class="container">
        <div id="view-home" class="view-section">
            <h1 style="text-align:center; color:var(--primary)">VOCAB DUNGEON</h1>
            <button class="btn btn-primary" onclick="switchView('menu')">開始挑戰</button>
            <button class="btn" onclick="switchView('add')">新增單字</button>
            <button class="btn" onclick="switchView('list')">字庫管理 (<span id="bankCount">0</span>)</button>
            
            <div class="home-footer-img">
                <img src="https://i.imgur.com/6UDmnhC.png" class="footer-img" />
            </div>
        </div>

        <div id="view-menu" class="view-section">
            <button class="btn" onclick="switchView('home')">← 返回</button>
            <h2>選擇模式</h2>
            <button class="btn btn-outline" onclick="startNormal('card')">生字卡 (自動讀音)</button>
            <button class="btn btn-outline" onclick="startNormal('quiz')">選擇題模式 (看中選英)</button>
            <hr style="width:100%; border:none; border-top:1px solid #ddd; margin:20px 0"/>
            <h3 style="color:var(--danger)">🏰 地下城戰鬥</h3>
            <button class="btn" onclick="startDungeon('low')">初級 (10層)</button>
            <button class="btn" onclick="startDungeon('mid')">中級 (15層)</button>
            <button class="btn" onclick="startDungeon('high')">高級 (20層)</button>
        </div>

        <div id="view-add" class="view-section">
            <button class="btn" onclick="switchView('home')">← 返回</button>
            <h2>新增單字</h2>
            <input type="text" id="newEng" placeholder="英文單字" />
            <button class="btn btn-outline" onclick="autoFetch()">✨ 智能翻譯 & 生成例句</button>
            <textarea id="newChi" placeholder="翻譯參考" rows="2"></textarea>
            <textarea id="newExample" placeholder="常用例句" rows="3"></textarea>
            <button class="btn btn-primary" onclick="addNewWord()">💾 儲存</button>
        </div>

        <div id="view-list" class="view-section">
            <button class="btn" onclick="switchView('home')">← 返回</button>
            <h3>我的字庫 (<span id="listCount">0</span>)</h3>
            <div style="display:flex; gap:5px; margin-bottom:15px">
                <button class="btn btn-outline btn-small" onclick="exportCSV()">📤 匯出 CSV</button>
                <button class="btn btn-outline btn-small" onclick="document.getElementById('csvInput').click()">📥 匯入 CSV</button>
                <input type="file" id="csvInput" style="display:none" accept=".csv" onchange="importCSV(event)" />
            </div>
            
            <div style="display:flex; gap:5px; margin-bottom:10px">
                <button class="btn btn-danger btn-small" onclick="clearAllWords()">🗑️ 移除所有生字</button>
                <button class="btn btn-primary btn-small" onclick="resetDefaultBank()">🔄 還原預設生字</button>
            </div>

            <div id="wordListContainer" style="max-height: 400px; overflow-y: auto; background:rgba(255,255,255,0.8); border-radius:10px;"></div>
        </div>

        <div id="view-study" class="view-section">
            <div class="card" id="studyCard" onclick="handleCardFlip()">
                <div id="card-unflipped" style="width:100%">
                    </div>
                <div id="card-flipped" style="display:none; text-align:left; width:100%">
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <strong style="font-size:1.4rem; color:var(--primary)" id="flipEng"></strong>
                    </div>
                    <hr/>
                    <strong>【翻譯】</strong><p id="flipChi"></p>
                    <div class="example-box"><strong>【常用例句】</strong><p id="flipEx"></p></div>
                </div>
            </div>
            
            <div id="studySpeakerArea" style="text-align:center; display:none; margin-bottom:10px;">
                <button class="speaker-btn" onclick="speak(currentWord.eng)">🔊 再讀一次</button>
            </div>

            <div id="quizOptions" class="quiz-grid" style="display:none"></div>
            <div id="studyFeedback" style="text-align:center; font-weight:bold; margin:10px; min-height:24px"></div>
            <button class="btn btn-primary" onclick="nextStudyWord()">下一個</button>
            <button class="btn" onclick="switchView('home')">返回</button>
        </div>

        <div id="view-dungeon" class="view-section">
            <div style="background: #2d3436; color: white; padding: 12px; border-radius: 15px; display:flex; justify-content:space-between; margin-bottom: 15px">
                <span id="hpDisplay">❤️ HP: 10</span>
                <span id="floorDisplay">FLOOR: 1/10</span>
            </div>
            <div class="battle-scene">
                <div class="timer-line" id="timerLine" style="width:100%"></div>
                <div class="monster-box">
                    <img src="https://i.imgur.com/BbjA5GC.png" id="monsterImg" class="monster-img" />
                </div>
                <div class="player-box">
                    <img src="https://i.imgur.com/gsR29ty.png" id="playerImg" class="player-img" />
                </div>
            </div>
            <div class="card" style="min-height:60px; padding: 15px; margin-bottom: 10px">
                <div style="font-size:1.3rem; font-weight:bold" id="dungeonChi"></div>
            </div>
            <div id="dungeonQuizGrid" class="quiz-grid"></div>
            <div id="dungeonBossArea" style="display:none">
                <input type="text" id="bossInput" placeholder="拼寫單字..." />
                <button class="btn btn-primary" onclick="submitBossAnswer()">⚡ 攻擊 BOSS</button>
            </div>
            <button class="btn" style="color:#999; margin-top: 10px" onclick="quitDungeon()">🏳️ 撤退</button>
        </div>

        <div id="view-end" class="view-section">
            <div style="text-align:center">
                <h1 id="endEmoji">🎉</h1>
                <h2 id="endTitle">完成！</h2>
            </div>
            <div style="background: rgba(255,255,255,0.95); padding: 15px; border-radius: 15px; margin-top: 15px;">
                <h4 style="margin: 0">📊 本次統計</h4>
                <p>擊殺: <span id="killedCount">0</span> | 錯誤: <span id="missedCount">0</span></p>
                <div id="killedList" style="font-size: 0.8rem; color: var(--success)"></div>
            </div>
            <button class="btn btn-primary" style="margin-top: 20px" onclick="switchView('home')">返回首頁</button>
        </div>
    </div>

    <div class="modal-overlay" id="chestModal">
        <div class="modal-content">
            <h3>🎉 獲得寶箱</h3>
            <img src="https://i.imgur.com/sAsVc32.png" id="chestImg" class="chest-img" onclick="openChest()" />
            <p id="chestTip">點擊寶箱！</p>
            <button class="btn btn-primary" style="margin-top: 10px; display:none" id="chestNextBtn" onclick="closeChestModal()">繼續前進</button>
        </div>
    </div>

    <script>
        const initialWords = [
            {eng:"concept", chi:"概念", example:"The teacher explained a difficult concept in class today.", id:1},
            {eng:"focus", chi:"專注/焦點", example:"You need to focus on your studies to get good grades.", id:2},
            {eng:"
